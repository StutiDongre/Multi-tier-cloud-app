name: ⚙️ Backend — Build & Deploy to EC2

on:
  push:
    branches: [main]
    paths:
      - 'multi-tier-app/backend/**'
      - 'multi-tier-app/infra/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

env:
  WORKING_DIR: multi-tier-app/backend

jobs:
  # ── Job 1: Test ───────────────────────────────────────────────────────
  test:
    name: 🧪 Lint & Validate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       taskflow_test
          POSTGRES_USER:     taskuser
          POSTGRES_PASSWORD: taskpass123
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U taskuser"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIR }}/package.json

      - name: 📦 Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: npm ci

      - name: 🔍 Check for syntax errors
        working-directory: ${{ env.WORKING_DIR }}
        run: node --check src/index.js && node --check src/db.js && echo "✅ No syntax errors"

      - name: 🏥 Smoke test health endpoint
        working-directory: ${{ env.WORKING_DIR }}
        env:
          NODE_ENV:    test
          PORT:        3001
          DB_HOST:     localhost
          DB_PORT:     5432
          DB_NAME:     taskflow_test
          DB_USER:     taskuser
          DB_PASSWORD: taskpass123
          FRONTEND_URL: "*"
        run: |
          node src/index.js &
          SERVER_PID=$!
          sleep 8
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/api/health)
          kill $SERVER_PID 2>/dev/null || true
          echo "Health endpoint returned: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Health check failed (expected 200, got $HTTP_CODE)"
            exit 1
          fi
          echo "✅ Health check passed"

  # ── Job 2: Deploy to EC2 ─────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to EC2 via SSH
    runs-on: ubuntu-latest
    needs: test
    environment:
      name: production

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🔑 Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: 🚀 Deploy to EC2
        run: |
          ssh -i ~/.ssh/ec2_key.pem \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=30 \
              ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
              'bash -s' << 'ENDSSH'
            set -e
            echo "📥 Pulling latest code..."
            cd /opt/taskflow
            git pull origin main

            echo "🔨 Rebuilding Docker containers..."
            cd multi-tier-app/infra
            docker compose up --build -d --remove-orphans

            echo "🧹 Cleaning up unused images..."
            docker image prune -f

            echo "🏥 Waiting for health check..."
            sleep 15
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health)
            echo "Health endpoint: $HTTP_CODE"
            if [ "$HTTP_CODE" != "200" ]; then
              echo "❌ Backend health check failed after deploy!"
              docker compose logs backend --tail=50
              exit 1
            fi
            echo "✅ Deploy successful!"
          ENDSSH

      - name: 🧹 Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/ec2_key.pem

      - name: 📊 Deployment Summary
        run: |
          echo "## ⚙️ Backend Deployed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| EC2 Host | \`${{ secrets.EC2_HOST }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| API Health | \`http://${{ secrets.EC2_HOST }}/api/health\` |" >> $GITHUB_STEP_SUMMARY
