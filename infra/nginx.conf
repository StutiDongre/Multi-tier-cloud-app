server {
    listen 80;
    server_name _;          # Replace with your EC2 public IP or domain

    # ── Security headers ───────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"    always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header Referrer-Policy        "no-referrer-when-downgrade" always;

    # ── Backend API — proxy to Docker container ─────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade       $http_upgrade;
        proxy_set_header   Connection    'upgrade';
        proxy_set_header   Host          $host;
        proxy_set_header   X-Real-IP     $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout  90s;
        proxy_connect_timeout 5s;

        # CORS (handled by Express, but Nginx as backup)
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # ── Health check shortcut ───────────────────────────────────────────
    location /health {
        proxy_pass http://127.0.0.1:3000/api/health;
    }

    # ── Default: show 404 (frontend lives on S3, not this server) ───────
    location / {
        return 200 '{"message":"TaskFlow Backend is running","docs":"/api/health"}';
        add_header Content-Type application/json;
    }
}
